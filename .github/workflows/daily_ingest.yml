name: Daily NHL Data Pipeline

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      full_schedule_backfill:
        description: Scan all schedule history instead of the recent daily window
        type: boolean
        default: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          FULL_SCHEDULE_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_schedule_backfill || false }}
        run: python -m extract.pipeline
